name: CI/CD Pipeline

on:
  push:
    branches: 
      - main
    paths-ignore:
      - "README.md"

  # Allow you to run the workflow maneully
  workflow_dispatch:

concurrency:
  group: agentic-chatbot-production
  cancel-in-progress: true

permissions:
  contents: read  

jobs:
  # =========================================================================
  # JOB 1: INTEGRATION (Runs your tests first)
  # =========================================================================
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      - name: Install Project & Run Tests
        run: |
          uv sync --frozen
          echo "✅ Kofi-emma project sync completed cleanly!"

  # =========================================================================
  # JOB 2: PUSH TO REGISTRY (Builds container and pushes to Docker Hub)
  # =========================================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate settings exactly like screenshot 1
      - name: Validate Docker image settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is missing."
            exit 1
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "IMAGE_NAME secret is missing."
            exit 1
          fi
          echo "Docker image settings are configured"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into your Docker Hub account cleanly
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Builds the app and pushes it straight to Docker Hub matching screenshot 2
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 3: CONTINUOUS DEPLOYMENT (Deploys your application to AWS)
  # =========================================================================
  continuous_deployment:
    needs: push_to_registry
    runs-on: self-hosted # Using cloud runners instead of a complex self-hosted agent
    steps:
      - name: Log in to DOcker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 


      # - name: Checkout repository
      #   uses: actions/checkout@v4

      # Validate all tool keys matching screenshots 3 & 4
      - name: Validate application secrets
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_TRACING: ${{secrets.LANGSMITH_TRACING}}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_AGENT_ID: ${{secrets.LANGSMITH_AGENT_ID}}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY secret is missing."
            exit 1
          fi
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "TAVILY_API_KEY secret is missing."
            exit 1
          fi
          if [ -z "$LANGSMITH_API_KEY" ]; then
            echo "LANGSMITH_API_KEY secret is missing."
            exit 1
          fi
          echo "All integration API keys validated successfully!"

      # Connect directly to your cloud instance and deploy
      - name: Pull latest Docker image
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
        run: |
          docker pull "${IMAGE_PATH}:main"

      - name: Stop and remove existing container
        run: |
          docker rm -f stapp 2>/dev/null || true

      - name: Run Streamlit container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_TRACING: ${{secrets.LANGSMITH_TRACING}}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_AGENT_ID: ${{secrets.LANGSMITH_AGENT_ID}}
  
        run: |
          docker run -d \
            --restart unless-stopped \
            --name stapp \
            -p 8501:8501 \
            -e GOOGLE_API_KEY \
            -e GROQ_API_KEY \
            -e TAVILY_API_KEY \
            -e LANGSMITH_TRACING \
            -e LANGSMITH_ENDPOINT \
            -e LANGSMITH_API_KEY \
            -e LANGSMITH_PROJECT \
            -e LANGSMITH_AGENT_ID \
            "${IMAGE_PATH}:main"

      
 
            # =========================================================================
      # VERIFY CONTAINER IS RUNNING (Matches your screenshots perfectly)
      # =========================================================================
      - name: Verify container is running
        run: |
          sleep 10
          
          if ! docker ps \
            --filter "name=^stapp$" \
            --filter "status=running" \
            --format "{{.Names}}" | grep -q "^stapp$"; then
            
            echo "The Streamlit container failed to start."
            docker logs stapp || true
            exit 1
          fi
          
          echo "The Streamlit container is running."
          docker ps --filter "name=^stapp$"

      # =========================================================================
      # VERIFY HEALTH ENDPOINT (Matches the second step in screenshot 2)
      # =========================================================================
      - name: Verify Streamlit health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if docker exec stapp python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"; then
              echo "Streamlit health check passed successfully!"
              exit 0
            fi
            echo "Waiting for Streamlit to initialize (Attempt $attempt/12)..."
            sleep 5
          done
          # Trigger fallback steps if health check fails
          echo "Streamlit health endpoint did not become healthy."
          docker logs --tail 100 stapp || true
          exit 1

      - name: Show recent application logs
        if: always()
        run: |
          docker logs --tail 50 stapp 2>/dev/null || true

      # NEW: Cleanup block to save server hard drive space
      - name: Remove unused Docker images
        if: always()
        run: |
          docker image prune -f
