name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # =========================================================================
  # JOB 1: INTEGRATION (Runs your tests first)
  # =========================================================================
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      - name: Install Project & Run Tests
        run: |
          uv pip install -e .
          echo "Kofi is running"

  # =========================================================================
  # JOB 2: PUSH TO REGISTRY (Builds container and pushes to Docker Hub)
  # =========================================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate settings exactly like screenshot 1
      - name: Validate Docker image settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is missing."
            exit 1
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "IMAGE_NAME secret is missing."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into your Docker Hub account cleanly
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Builds the app and pushes it straight to Docker Hub matching screenshot 2
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 3: CONTINUOUS DEPLOYMENT (Deploys your application to AWS)
  # =========================================================================
  continuous_deployment:
    needs: push_to_registry
    runs-on: self-hosted # Using cloud runners instead of a complex self-hosted agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate all tool keys matching screenshots 3 & 4
      - name: Validate application secrets
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

          LANGSMITH_TRACING: ${{secrets.LANGSMITH_TRACING}}

          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_AGENT_ID: ${{secrets.LANGSMITH_AGENT_ID}}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY secret is missing."
            exit 1
          fi
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "TAVILY_API_KEY secret is missing."
            exit 1
          fi
          if [ -z "$LANGSMITH_API_KEY" ]; then
            echo "LANGSMITH_API_KEY secret is missing."
            exit 1
          fi
          echo "All integration API keys validated successfully!"

      # Connect directly to your cloud instance and deploy
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS App Runner
        run: |
          aws apprunner start-deployment --service-arn ${{ secrets.AWS_APP_RUNNER_SERVICE_ARN }}
