name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  # Allow you to run the workflow maneully
  workflow_dispatch:

concurrency:
  group: agentic-chatbot-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # JOB 1: INTEGRATION (Runs your tests first)
  # =========================================================================
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test_research_agent.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      - name: Install Project & Run Tests
        run: |
          uv sync --frozen
          echo "✅ ScholarGraph project sync completed cleanly!"

      - name: Run auth test suite
        run: |
          uv run python tests/test_auth.py

      - name: Verify strict token blocklist mode
        run: |
          uv run python tests/test_strict_mode.py

  # =========================================================================
  # JOB 2: PUSH TO REGISTRY (Builds container and pushes to Docker Hub)
  # =========================================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate Docker image settings
      - name: Validate Docker image settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is missing."
            exit 1
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "IMAGE_NAME secret is missing."
            exit 1
          fi
          echo "Docker image settings are configured"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into Docker Hub cleanly
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Builds the app and pushes it straight to Docker Hub
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}-backend:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend


        # 🚨 Build the Frontend Image
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}-frontend:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # =========================================================================
  # JOB 3: CONTINUOUS DEPLOYMENT (Deploys backend, worker and frontend)
  # =========================================================================
  continuous_deployment:
    needs: push_to_registry
    runs-on: self-hosted
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate application secrets
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          for var in GOOGLE_API_KEY GROQ_API_KEY TAVILY_API_KEY SECRET_KEY \
                     MAIL_USERNAME MAIL_PASSWORD MAIL_FROM LANGSMITH_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "$var secret is missing."
              exit 1
            fi
          done
          echo "All integration API keys validated successfully!"

      - name: Pull latest Docker images
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
        run: |
          docker pull "${IMAGE_PATH}-backend:main"
          docker pull "${IMAGE_PATH}-frontend:main"

      - name: Stop and remove existing containers
        run: |
          docker rm -f ScholarGraph-backend ScholarGraph-celery ScholarGraph-redis stapp 2>/dev/null || true
          docker network rm scholargraph-net 2>/dev/null || true
          
      - name: Create Docker Network & Volumes
        run: |
          docker network create scholargraph-net
          docker volume create scholargraph_chroma
          docker volume create scholargraph_uploads

      # ── Redis (token blocklist + Celery broker) ──
      - name: Start Redis container
        run: |
          docker run -d \
            --restart unless-stopped \
            --name ScholarGraph-redis \
            --network scholargraph-net \
            redis:7-alpine

      # ── FastAPI backend ──
      - name: Run FastAPI backend container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          TOKEN_BLOCKLIST_STRICT: "true"
        run: |
          docker run -d \
            --restart unless-stopped \
            --name ScholarGraph-backend \
            --network scholargraph-net \
            -p 8000:8000 \
            -v scholargraph_chroma:/app/data/chroma_db \
            -v scholargraph_uploads:/app/uploads \
            -e GOOGLE_API_KEY \
            -e GROQ_API_KEY \
            -e TAVILY_API_KEY \
            -e SECRET_KEY \
            -e MAIL_USERNAME \
            -e MAIL_PASSWORD \
            -e MAIL_FROM \
            -e MAIL_FROM_NAME \
            -e MAIL_SERVER \
            -e MAIL_PORT \
            -e PUBLIC_BASE_URL \
            -e TOKEN_BLOCKLIST_STRICT \
            -e LANGSMITH_API_KEY \
            -e LANGCHAIN_TRACING_V2="true" \
            -e LANGCHAIN_PROJECT="ScholarGraph-Prod" \
            -e REDIS_URL=redis://ScholarGraph-redis:6379/0 \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            "${IMAGE_PATH}-backend:main"

      # ── Celery worker ──
      - name: Run Celery worker container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          docker run -d \
            --restart unless-stopped \
            --name ScholarGraph-celery \
            --network scholargraph-net \
            -v scholargraph_chroma:/app/data/chroma_db \
            -v scholargraph_uploads:/app/uploads \
            -e GOOGLE_API_KEY \
            -e GROQ_API_KEY \
            -e TAVILY_API_KEY \
            -e SECRET_KEY \
            -e MAIL_USERNAME \
            -e MAIL_PASSWORD \
            -e MAIL_FROM \
            -e MAIL_FROM_NAME \
            -e MAIL_SERVER \
            -e MAIL_PORT \
            -e LANGSMITH_API_KEY \
            -e LANGCHAIN_TRACING_V2="true" \
            -e LANGCHAIN_PROJECT="ScholarGraph-Prod" \
            -e REDIS_URL=redis://ScholarGraph-redis:6379/0 \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            "${IMAGE_PATH}-backend:main" \
            celery -A src.celery_worker.celery_app worker --loglevel=info

      # ── Streamlit frontend ──
      - name: Run Streamlit container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          API_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          docker run -d \
            --restart unless-stopped \
            --name stapp \
            --network scholargraph-net \
            -p 8501:8501 \
            -e API_BASE_URL \
            -e FRONTEND_BASE_URL \
            "${IMAGE_PATH}-frontend:main"

      # =========================================================================
      # VERIFY CONTAINERS ARE RUNNING
      # =========================================================================
      - name: Verify containers are running
        run: |
          sleep 10
          for name in ScholarGraph-redis ScholarGraph-backend ScholarGraph-celery stapp; do
            if ! docker ps \
              --filter "name=^${name}$" \
              --filter "status=running" \
              --format "{{.Names}}" | grep -q "^${name}$"; then
              echo "The ${name} container failed to start."
              docker logs "${name}" || true
              exit 1
            fi
            echo "✅ ${name} is running."
          done

      - name: Verify FastAPI health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if docker exec ScholarGraph-backend python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"; then
              echo "FastAPI health check passed successfully!"
              exit 0
            fi
            echo "Waiting for FastAPI to initialize (Attempt $attempt/12)..."
            sleep 5
          done
          echo "FastAPI health endpoint did not become healthy."
          docker logs --tail 100 ScholarGraph-backend || true
          exit 1

      - name: Verify Celery worker registered the Send_email task
        run: |
          docker exec ScholarGraph-celery celery -A src.celery_worker.celery_app inspect registered 2>&1 | grep -q "Send_email" \
            && echo "✅ Celery worker has the Send_email task registered." \
            || { echo "❌ Send_email task not registered."; docker logs ScholarGraph-celery; exit 1; }

      - name: Verify Streamlit health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if docker exec stapp python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"; then
              echo "Streamlit health check passed successfully!"
              exit 0
            fi
            echo "Waiting for Streamlit to initialize (Attempt $attempt/12)..."
            sleep 5
          done
          echo "Streamlit health endpoint did not become healthy."
          docker logs --tail 100 stapp || true
          exit 1

      - name: Show recent application logs
        if: always()
        run: |
          docker logs --tail 50 ScholarGraph-backend 2>/dev/null || true
          docker logs --tail 50 ScholarGraph-celery 2>/dev/null || true
          docker logs --tail 50 stapp 2>/dev/null || true

      - name: "Cleanup: Remove unused Docker images"
        if: always()
        run: |
          docker image prune -f